format: story
set: school_yard
title: In This Town, Every Mean Word Makes You Shorter
description: Rex tried to bully Sam, but every mean word shrank him down.
bgm_mood: mystery
lighting: day_bright
engine: social_karma
rule_type: curse
opening_variant: rule_first
ending_type: karma_reversal
rule: Saying mean words shrinks your height.
visible_proof: Rex shrinks every time he shouts a mean word.
personal_stake: Sam must protect his little brother Toby.
motivated_choice: Sam stays calm and refuses to say anything mean.
rule_payoff: Rex insults them repeatedly until he shrinks away completely.
cta: Would you stay calm if someone bullied you?
