# ============================================================================
# Editorial Brief:
#   1. Opening picture: Zane walks through a deserted school courtyard that is completely empty to his eyes.
#   2. Character want: Zane wants to intimidate the student body and assert total dominance.
#   3. Visible obstacle: School rule causes anyone who fears him to become totally invisible to him.
#   4. Choice & cost: Zane wanders through empty spaces in mounting isolation, desperate to find anyone alive.
#   5. Final picture: Zane falls to the ground in shock as the one kid who does not fear him eats lunch in peace.
#   6. Cut redundant line: Removed inner monologue about Zane's middle school reputation.
# ============================================================================
id: "009"
format: story
