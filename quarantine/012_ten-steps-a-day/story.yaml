id: '012'
format: story
set: street_day
title: In This Town, You Only Have Ten Steps A Day
description: Max tried to make Sam run out of steps, until Max turned to stone.
bgm_mood: tension
lighting: neon_drop
engine: clever_loophole
rule_type: curse
opening_variant: rule_first
ending_type: karma_reversal
rule: Everyone gets ten steps a day, or turns to stone until tomorrow.
visible_proof: Anyone who hits zero steps turns into a frozen stone statue on screen.
personal_stake: Max steals Sam's bus pass and tries to trap Sam with one step left.
motivated_choice: Sam stands still and saves his last step while Max charges the crosswalk.
rule_payoff: Max hits zero steps mocking Sam and turns to stone in the crosswalk.
cta: Would you rush or save your step?
