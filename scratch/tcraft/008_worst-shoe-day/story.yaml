# ============================================================================
# Editorial Brief:
#   1. Opening picture (muted): Kai flicks a wrapper at the trash can by the Planter; it bounces off; he walks away grinning.
#   2. Character want: a normal day in his brand-new shoes, and to look cool in the team photo.
#   3. Visible obstacle: everyone turns, laughs, points and backs away from him all day.
#   4. Choice & cost: he blames the floor, the kids, a "prank" instead of looking down; it ruins the photo.
#   5. Final picture: the Frame-1 wrapper is on his sole; he re-throws, misses, it sticks to the OTHER shoe.
#   6. Cut line: "I slipped and fell" — knockback shows it.
#   7. Engine social_karma; CTA below.
# Self-kill: spoiler — title/first 10s point at "why are they laughing", not the shoe (cause hidden till beat 18).
#   loud stakes — Zoe laughs and points by ~4s. Scenes: entrance (bin) -> lunch line by benches -> PlayCourt dodgeball -> SchoolShowStage photo; props —
#   2 custom props in `props:` (TrashCan by Kai's start, Wrapper welded to his right shoe; hidden at beat 20, re-attached to left shoe at beat 22).
# ============================================================================
id: "008"
format: story
set: school_yard
title: "Why Is Everyone Laughing? 😭"
description: "Kai's brand-new shoes, his big day... and the whole school won't stop laughing at him."
hashtags: ["#roblox", "#rblx", "#robloxstories", "#shorts"]
bgm_mood: mystery
lighting: day_bright
caption_margin_v: 560
engine: social_karma
cta: "Rewatch: count how many times you hear the crinkle."
thumb_at: 4.0

cast:
  - { name: Kai,   gender: boy,  default_face: grin,    pos: [-14, 0, -12], yaw: 180 }
  - { name: Milo,  gender: boy,  default_face: neutral, pos: [1, 0, -3],    yaw: 90, shirt: 12329928029, pants: 134609569320601, hair: "124340390453001" }
  - { name: Zoe,   gender: girl, default_face: neutral, pos: [-9, 0, -6],   yaw: 90, shirt: 5688801027, pants: 6092144716 }
  - { name: Coach, gender: man,  default_face: neutral, pos: [-22, 0, 1],   yaw: 180, shirt: 2885430411, pants: 140429444258386, hair: "120646937583722" }

props:
  - { name: TrashCan, shape: cylinder, size: [3, 2, 2], color: [46, 110, 70], material: Metal, pos: [-15.3, 1.7, -10.8], rot: [0, 0, 90] }
  - { name: Wrapper, size: [0.8, 0.06, 0.55], color: [230, 60, 160], material: Foil, attach: "Kai/Right Leg", offset: [0.05, -0.92, -0.62], rot: [-18, 12, 0] }
  - { name: PhotoCam, size: [1.3, 0.85, 0.5], color: [200, 202, 210], material: Metal, attach: "Coach/Head", offset: [0, -0.05, -0.85], hide: true }
  - { name: PhotoLens, shape: cylinder, size: [0.5, 0.6, 0.6], color: [20, 20, 22], material: Metal, attach: "Coach/Head", offset: [0, -0.05, -1.3], rot: [0, 90, 0], hide: true }

beats:
  # SCENE A — school entrance, morning (bin beside Kai, face to camera)
  - { dur: 1.8, cam: front, fov: 52, motion: push_in, target: Kai, action: point, face: grin, sfx: whoosh, speaker: narrator, line: "Monday morning. I tossed my candy wrapper and *walked* off." }
  - { dur: 1.8, cam: closeup, fov: 44, motion: push_in, target: Kai, action: idle, face: proud, speaker: boy, line: "Brand new shoes. First day. Looking *clean*." }
  - { dur: 1.8, cam: side_track, fov: 48, motion: push_in, target: Kai, action: walk, move_to: [-11, 0, -7], face: grin, sfx: scraping_drag, speaker: narrator, line: "Every step went squeak, *crinkle*." }
  - { dur: 1.8, cam: wide, fov: 56, motion: static, target: Zoe, action: point, face: grin, with: [{ name: Kai, action: idle, face: shocked }], face_partner: true, speaker: girl, line: "Hey, is that *you* making that noise?" }
  - { dur: 1.7, cam: closeup, fov: 44, motion: push_in, target: Kai, action: idle, face: determined, yaw: 180, speaker: boy, line: "It's the floor. The floor is *broken*." }

  # SCENE B — lunch line by the benches
  - { dur: 2.0, cam: side_track, fov: 48, motion: push_in, target: Kai, action: walk, snap_to: [5, 0, -3], yaw: 90, move_to: [3, 0, -3], face: neutral, with: [{ name: Milo, action: walk, move_to: [1, 0, -6.5], face: shocked }], sfx: scraping_drag, speaker: narrator, line: "Lunch line. *Crinkle*. Milo moved two spots back." }
  - { dur: 1.8, cam: closeup, fov: 44, motion: push_in, target: Milo, action: idle, face: shocked, yaw: -60, speaker: boy, line: "Dude, did you step in *something*?" }
  - { dur: 1.8, cam: closeup, fov: 44, motion: push_in, target: Kai, action: idle, face: determined, speaker: boy, line: "I smell like *cookies*. Back off." }

  # SCENE C — dodgeball on the PlayCourt (Coach at the hoop end)
  - { dur: 1.9, cam: wide, fov: 56, motion: push_in, target: Kai, action: idle, snap_to: [-20, 0, 8], yaw: 0, face: proud, with: [{ name: Coach, action: wave, snap_to: [-22, 0, -2], yaw: 180, face: neutral }, { name: Milo, action: idle, snap_to: [-24, 0, 8], yaw: 0, face: neutral }, { name: Zoe, action: idle, snap_to: [-27, 0, 8], yaw: 0, face: neutral }], sfx: whistle_blow, speaker: narrator, line: "Dodgeball. I got picked *first* for once." }
  - { dur: 1.6, cam: side_track, fov: 48, motion: push_in, target: Kai, action: run, move_to: [-20, 0, 4.5], face: determined, sfx: whoosh, speaker: narrator, line: "Big wind-up. Perfect *throw*—" }
  - { dur: 1.7, cam: side_track, fov: 58, motion: static, target: Kai, action: fall, face: shocked, sfx: thud, speaker: narrator, line: "*Squeak*. Face first onto the court." }
  - { dur: 1.8, cam: wide, fov: 54, motion: static, target: Milo, action: point, face: grin, yaw: -45, with: [{ name: Zoe, action: point, face: grin, yaw: -55 }], speaker: girl, line: "He slipped on *nothing*!" }
  - { dur: 1.9, cam: closeup, fov: 44, motion: push_in, target: Kai, action: idle, face: scared, yaw: 135, speaker: boy, line: "Why is everyone *laughing* at me today?!" }

  # SCENE D — team photo in front of the show stage (Coach takes the picture)
  - { dur: 1.8, cam: side_track, fov: 48, motion: push_in, target: Kai, action: walk, snap_to: [18, 0, 3], move_to: [14.5, 0, 1.5], face: grin, with: [{ name: Coach, action: block, snap_to: [14, 0, 8], yaw: 0, face: neutral }], prop: [{ name: PhotoCam, show: true }, { name: PhotoLens, show: true }], speaker: narrator, line: "Then the team trophy *photo*." }
  - { dur: 1.9, cam: high_angle, fov: 52, motion: static, target: Kai, action: dance, yaw: 180, face: proud, with: [{ name: Coach, action: block, face: grin }, { name: Milo, action: idle, snap_to: [12, 0, 1.5], yaw: 180, face: grin }, { name: Zoe, action: idle, snap_to: [17, 0, 1.5], yaw: 180, face: grin }], speaker: adult, line: "Okay team, squeeze in! Everybody say *cheese*!" }
  - { dur: 1.7, cam: closeup, fov: 44, motion: push_in, target: Coach, action: block, face: shocked, sfx: shutter, speaker: adult, line: "Uh... what's *on* you?" }
  - { dur: 1.8, cam: closeup, fov: 44, motion: shake, target: Kai, action: point, face: determined, prop: [{ name: PhotoCam, hide: true }, { name: PhotoLens, hide: true }], speaker: boy, line: "Nothing! Somebody's *pranking* me!" }

  # TWIST — still at the stage; a bin sits by the steps
  - { dur: 1.9, cam: ots, fov: 46, motion: push_in, target: Milo, action: point, face: neutral, with: [{ name: Kai, action: idle, face: neutral }], face_partner: true, prop: { name: TrashCan, pos: [17, 1.7, 5.5], rot: [0, 0, 90] }, pause_before: 0.30, bgm_duck: true, speaker: boy, line: "Bro. Look down. No, *lower*." }
  - { dur: 2.2, cam: foot_insert, fov: 40, motion: push_in, target: Kai, action: idle, face: shocked, yaw: 180, sfx: bass_hit, allow_hold: true, speaker: narrator, line: "My wrapper. Stuck to my *shoe*. All day." }
  - { dur: 1.8, cam: side_track, fov: 48, motion: push_in, target: Kai, action: walk, move_to: [15.5, 0, 4], face: determined, with: [{ name: Coach, action: walk, move_to: [22, 0, 12] }], prop: { name: Wrapper, hide: true }, speaker: narrator, line: "I peeled it off and threw it at the *bin*." }
  - { dur: 1.6, cam: side_track, fov: 48, motion: static, target: Kai, action: point, face: grin, yaw: 225, sfx: tick, speaker: narrator, line: "Missed. *Again*. Of course I did." }
  - { dur: 1.9, cam: foot_insert, fov: 42, motion: push_in, target: Kai, action: walk, move_to: [14.6, 0, 4.6], face: shocked, prop: { name: Wrapper, attach: "Kai/Left Leg", offset: [-0.05, -0.92, -0.62], rot: [-18, -12, 0], show: true }, sfx: scraping_drag, speaker: narrator, line: "One step. *Crinkle*." }
  - { dur: 1.8, cam: wide, fov: 54, motion: pull_out, target: Kai, action: idle, face: scared, with: [{ name: Milo, action: point, face: grin }, { name: Zoe, action: point, face: grin }], bgm_climax: true, sfx: ding, speaker: girl, line: "Other *shoe*! Again?!" }
  # ENDING — echoes frame 1 ("walked off"), still crinkling
  - { dur: 3.2, cam: wide, fov: 54, motion: pull_out, target: Kai, action: walk, move_to: [10, 0, 10], face: determined, sfx: scraping_drag, allow_hold: true, pause_before: 0.30, speaker: narrator, line: "So I just... *walked* off. Crinkle." }
