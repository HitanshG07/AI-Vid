# ============================================================================
# WORKED BLUEPRINT 2: Roblox-Native Obby Twist (~44s, 20 beats, ~40% dialogue)
# Editorial Brief:
#   1. Opening picture (muted): On a high Roblox obby platform, Duo clears the jump—then deliberately steps off the edge.
#   2. Character want: Hero wants to beat the final obby stage with his duo.
#   3. Visible obstacle: His duo keeps throwing the run at the very last jump.
#   4. Choice & cost: Hero reaches the finish line first and chooses NOT to step on the win pad.
#   5. Final picture: Hero waits at the edge for his duo—revealing the win pad teleports solo winners out immediately.
#   6. Cut redundant line: Removed "In this Roblox obby, winners get kicked" — the duo's confession + Hero waiting shows it.
# ============================================================================
id: "BLUEPRINT_02"
format: roblox_game
set: anime_arena
title: "He Threw the Last Jump 😭"
description: "My duo cleared every obstacle in the obby, then stepped off the final platform on purpose."
hashtags: ["#roblox", "#rblx", "#obby", "#shorts"]
bgm_mood: wholesome
lighting: day_bright
caption_margin_v: 560
engine: moral_dilemma
cta: "Would you have thrown the jump too?"
thumb_at: 1.0

cast:
  - { name: Hero,  gender: boy, default_face: shocked,    pos: [-4, 0, 2],  yaw: 90 }
  - { name: Duo,   gender: boy, default_face: grin,       pos: [4, 0, 2],   yaw: -90 }
  - { name: Rival, gender: boy, default_face: grin,       pos: [9, 0, -4],  yaw: -90 }

beats:
  # HOOK (0-5s): Instant Roblox-native visual contradiction
  - { dur: 2.1, cam: side_track, fov: 48, motion: push_in, target: Duo, action: run, move_to: [8, 0, 2], face: grin, sfx: whoosh, speaker: narrator, line: "My duo cleared the jump, then *walked* off." }
  - { dur: 2.1, cam: closeup, fov: 44, motion: shake, target: Hero, action: point, face: shocked, speaker: boy, sfx: thud, line: "Bro, why are you *trolling*?! We almost won!" }
  - { dur: 2.1, cam: wide, fov: 56, motion: push_in, target: Rival, action: dance, face: grin, with: [{ name: Hero, action: idle, face: determined }], speaker: villain, line: "Haha, your teammate can't touch the *pad*!" }

  # ESCALATION (5-24s): Pattern repeats 3 times
  - { dur: 2.1, cam: wide, fov: 54, motion: push_in, target: Hero, action: run, move_to: [-1, 0, 2], with: [{ name: Duo, action: run, move_to: [5, 0, 2], face: grin }], speaker: boy, sfx: whoosh, line: "Race you to the *last* jump, bro!" }
  - { dur: 2.1, cam: ots, fov: 46, motion: push_in, target: Duo, action: walk, move_to: [2, 0, 2], face: neutral, with: [{ name: Hero, action: idle }], face_partner: true, speaker: narrator, line: "Attempt two. I slipped behind *him*." }
  - { dur: 2.1, cam: closeup, fov: 44, motion: push_in, target: Duo, action: knockback, face: neutral, sfx: whoosh, speaker: narrator, line: "Inches from the finish, he jumped *off* again." }
  - { dur: 2.1, cam: closeup, fov: 44, motion: shake, target: Rival, action: point, face: grin, speaker: villain, line: "Another reset? This is the *funniest* run ever!" }
  - { dur: 2.1, cam: reverse_ots, fov: 46, motion: shake, target: Hero, action: point, face: determined, with: [{ name: Duo, action: idle, face: neutral }], speaker: boy, line: "Stop *resetting*! Just finish without me!" }
  - { dur: 2.1, cam: closeup, fov: 44, motion: push_in, target: Duo, action: idle, face: grin, speaker: adult, line: "My bad, lag spike. Let's run it *one* more time." }
  - { dur: 2.1, cam: ots, fov: 46, motion: push_in, target: Hero, action: point, face: determined, with: [{ name: Duo, action: block, face: scared }], speaker: boy, line: "Okay. This time I *don't* look down." }
  - { dur: 2.1, cam: side_track, fov: 48, motion: push_in, target: Hero, action: run, move_to: [6, 0, 2], with: [{ name: Duo, action: run, move_to: [1, 0, 2], face: determined }], speaker: narrator, line: "Attempt three. I nailed every *jump*." }
  - { dur: 2.1, cam: closeup, fov: 44, motion: push_in, target: Duo, action: idle, face: scared, sfx: tick, speaker: adult, line: "Dude, don't *look* at the pad. Just jump." }
  - { dur: 2.1, cam: prop_insert, fov: 40, motion: push_in, target: Hero, action: idle, face: shocked, sfx: ding, speaker: narrator, line: "I reached the finish pad and read the *sign*." }

  # TWIST & PAYOFF (24-44s): Silence drop -> reversal
  - { dur: 2.1, cam: side_track, fov: 48, motion: push_in, target: Duo, action: walk, move_to: [7, 0, 2], face: scared, speaker: adult, sfx: tick, line: "Hero, wait! Don't *step* on it yet!" }
  - { dur: 2.0, cam: closeup, fov: 44, motion: push_in, target: Hero, action: idle, face: shocked, bgm_duck: true, pause_before: 0.30, speaker: narrator, line: "Solo winners get *teleported*. Others restart." }
  - { dur: 2.1, cam: wide, fov: 54, motion: push_in, target: Duo, action: run, move_to: [3, 0, 2], face: scared, speaker: narrator, line: "He never lagged. He reset to save my *streak*." }
  - { dur: 2.1, cam: closeup, fov: 44, motion: push_in, target: Duo, action: idle, face: neutral, with: [{ name: Hero, action: idle, face: shocked }], speaker: adult, line: "I wanted you to get *there* first. That's all." }
  - { dur: 2.1, cam: ots, fov: 46, motion: push_in, target: Rival, action: point, face: grin, with: [{ name: Hero, action: idle, face: determined }], speaker: villain, line: "What are you waiting for?! Step on it and *win*!" }
  - { dur: 2.0, cam: closeup, fov: 44, motion: push_in, target: Hero, action: wave, face: proud, bgm_climax: true, sfx: ding, speaker: boy, line: "Not without my *duo*." }
  - { dur: 2.0, cam: wide, fov: 52, motion: pull_out, target: Duo, action: run, move_to: [6, 0, 2], with: [{ name: Hero, action: wave, face: proud }], face_partner: true, speaker: narrator, line: "I stopped short, held out my *hand*." }
  - { dur: 1.8, cam: low_hero, fov: 48, motion: pull_out, target: Hero, action: dance, face: proud, with: [{ name: Duo, action: dance, face: proud }], sfx: bass_hit, speaker: narrator, line: "We crossed *together*." }
