# Editorial brief
# 1. Muted hook. Copper coin on edge between couch cushions. Nia blocks Ben's
#    square hand. A sliver of red tape peeks out under the couch.
# 2. Ben wants his last claw-machine coin back.
# 3. The coin vanishes into a seam barely wide enough for his blocky forearm.
# 4. He stops digging and follows Nia's point to the far end of the couch.
#    He gives up his chance to grab the silver coin before she drops it.
# 5. Copper beats silver across the red tape. Nia was keeping his hand off
#    the starting gate. No second reveal.
# 6. Cut "It was a race." The two lanes and finish line show it.
#
# Studio staging for a later production pass
# Three story props are the oversized copper coin, silver coin, and cardboard
# track with red finish tape. The track fits beneath the existing couch.
# Beats 2–3 drop copper into the seam. Beat 8 sells the reach with a seam insert.
# Beats 9–10 show Nia planting both feet on the lifted cushion.
# Beat 11 moves the rattle to the far armrest. Beat 16 drops silver and gives it
# two distinct clicks. Beat 19 lowers Ben's head to carpet level with a cut.
# Beats 21–23 use carpet-height inserts. Reveal the two lanes, roll both coins
# out with copper slightly ahead, then hold on the red tape as copper wins.
